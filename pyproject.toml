[project]
name = "rag-qa-system"
version = "0.1.0"
description = "RAG 知识问答系统：MinerU 文档解析 + BGE-M3 向量化 + Milvus/Neo4j 双路检索 + RRF 融合 + BGE-reranker 重排 + Qwen 生成，LangGraph 编排"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.2",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "minio>=7.2.20",
    "modelscope>=1.35.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "regex>=2026.2.28",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "uvicorn>=0.42.0",
    "transformers>=4.57.6",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 存量代码基线豁免（TODO: 后续逐步重构消除，每消除一项就从这里移除）
# - F403/F405: conf 模块大量使用 from x import * 导入配置项
# - E722/F811: 个别裸 except 与重复定义，需结合业务逻辑重构
# - W293: 多行字符串内的空白行
ignore = ["E501", "F403", "F405", "E722", "F811", "W293"]
