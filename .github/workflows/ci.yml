name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 单元测试只依赖轻量包（核心算法模块为纯函数，无需 torch/milvus 等重依赖）
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy loguru fastapi python-dotenv

      - name: Run unit tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/
